<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>آفلاین | لایف‌هاب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #faf9f7; color: #0d0d0d;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .box { max-width: 320px; }
    .emoji { font-size: 48px; }
    h1 { font-size: 18px; font-weight: 800; margin: 16px 0 8px; }
    p { font-size: 13px; line-height: 1.9; color: #6b6b6b; }
    button {
      margin-top: 20px; background: #0d0d0d; color: #fff; border: 0;
      border-radius: 10px; padding: 10px 28px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">📡</div>
    <h1>اینترنت قطع است</h1>
    <p>الان به اینترنت دسترسی ندارید. صفحه‌هایی که قبلاً باز کرده‌اید آفلاین در دسترس‌اند، ولی ثبت اطلاعات جدید تا وصل شدن اینترنت ممکن نیست.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
